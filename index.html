<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Organizador de Tarefas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: none;
            background-color: #f9fafb;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* 60px Grid Pattern */
        .grid-bg {
            background-image: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 59px,
                #e5e7eb 59px,
                #e5e7eb 60px
            );
            background-size: 100% 60px;
        }

        .task-card {
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        .snap-transition {
            transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), top 0.2s ease-out;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.4);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 4px;
        }
        input[type=range]:focus { outline: none; }
    </style>
</head>
<body>

    <!-- Active Timer Banner -->
    <div id="activeTimerBanner" class="hidden bg-indigo-600 text-white p-3 shadow-md z-50 flex items-center justify-between shrink-0 transition-all duration-300">
        <div class="flex items-center gap-3">
            <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <div class="flex flex-col">
                <span id="timerCountdown" class="font-bold text-lg leading-tight">00:00</span>
                <span id="timerTaskName" class="text-xs text-indigo-200 truncate max-w-[150px]"></span>
            </div>
        </div>
        <button onclick="stopTimer()" class="p-2 hover:bg-white/20 rounded-full transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-4 py-3 shrink-0 shadow-sm z-40 flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
            <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
            Tarefas
        </h1>
        <div class="flex items-center gap-3">
            <button onclick="openGlobalFocusModal()" class="p-2 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-full transition-colors shadow-sm border border-indigo-100">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </button>
            <div id="realWorldClock" class="text-sm font-semibold text-gray-500 bg-gray-100 px-2 py-1.5 rounded-md border border-gray-200">--:--</div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative overflow-y-auto overflow-x-hidden no-scrollbar" id="scrollContainer">
        
        <!-- The Grid Container -->
        <div id="gridArea" class="relative w-full h-[1200px] grid-bg" onpointerdown="handleGridClick(event)">
            
            <!-- Real-time Timeline Dot -->
            <div class="absolute right-2 w-6 top-0 bottom-0 pointer-events-none z-30">
                <div class="absolute left-1/2 top-0 bottom-0 w-[2px] bg-indigo-100 -translate-x-1/2"></div>
                <div id="timelineDot" class="absolute left-1/2 w-4 h-4 bg-indigo-500 rounded-full shadow-md shadow-indigo-500/50 -translate-x-1/2 -translate-y-1/2 transition-all duration-1000 z-40 ring-4 ring-white">
                    <div class="absolute inset-0 bg-indigo-500 rounded-full animate-ping opacity-75"></div>
                </div>
            </div>

            <!-- Time Markers -->
            <div class="absolute left-4 z-20 flex items-center gap-2 cursor-pointer group pointer-events-auto" style="top: 60px; transform: translateY(-50%);" onclick="editMarker('start')">
                <div class="w-3 h-3 rounded-full bg-gray-400 group-hover:bg-indigo-500 transition-colors ring-4 ring-white"></div>
                <div class="bg-white/90 backdrop-blur-sm px-2 py-1 rounded-md shadow-sm border border-gray-100">
                    <span class="text-sm font-semibold text-gray-600 group-hover:text-indigo-600">Início: </span>
                    <span id="startTimeDisplay" class="text-sm font-bold text-indigo-600">13:00</span>
                </div>
            </div>

            <div class="absolute left-4 z-20 flex items-center gap-2 cursor-pointer group pointer-events-auto" style="top: 660px; transform: translateY(-50%);" onclick="editMarker('end')">
                <div class="w-3 h-3 rounded-full bg-gray-400 group-hover:bg-indigo-500 transition-colors ring-4 ring-white"></div>
                <div class="bg-white/90 backdrop-blur-sm px-2 py-1 rounded-md shadow-sm border border-gray-100">
                    <span class="text-sm font-semibold text-gray-600 group-hover:text-indigo-600">Fim: </span>
                    <span id="endTimeDisplay" class="text-sm font-bold text-indigo-600">18:00</span>
                </div>
            </div>

            <!-- Tasks Container -->
            <div id="tasksContainer" class="absolute inset-0 pointer-events-none"></div>

        </div>
    </main>

    <!-- New/Edit Task Modal -->
    <div id="taskModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity" onclick="closeModal('taskModal')">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all" onclick="event.stopPropagation()">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h2 id="taskModalTitle" class="text-xl font-bold text-gray-800">Nova Tarefa</h2>
                <button onclick="closeModal('taskModal')" class="text-gray-400 hover:text-gray-600 bg-gray-200/50 hover:bg-gray-200 p-2 rounded-full transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <form id="taskForm" onsubmit="saveTask(event)" class="p-6 space-y-5">
                <input type="hidden" id="taskYPos">
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Título da Tarefa *</label>
                    <input required id="taskTitle" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all" placeholder="Ex: Responder e-mails">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Descrição <span class="text-gray-400 font-normal">(Opcional)</span></label>
                    <textarea id="taskDesc" rows="2" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all resize-none" placeholder="Detalhes da tarefa..."></textarea>
                </div>

                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Início</label>
                        <input type="time" id="taskStartTime" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Término</label>
                        <input type="time" id="taskEndTime" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Cor de Identificação</label>
                    <div class="flex justify-between" id="colorPicker"></div>
                </div>

                <button type="submit" class="w-full pt-2">
                    <div class="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-md shadow-indigo-200">
                        Salvar Tarefa
                    </div>
                </button>
            </form>
        </div>
    </div>

    <!-- Task Specific Timer Modal -->
    <div id="timerModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeModal('timerModal')">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden" onclick="event.stopPropagation()">
            <div class="px-6 pt-6 pb-4 text-center">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-gray-800">Cronômetro da Tarefa</h3>
                <p id="timerModalTarget" class="text-gray-500 text-sm mt-1 truncate px-2"></p>
            </div>

            <div class="px-6 pb-6 space-y-3">
                <button onclick="startCountdown(25)" class="w-full py-3 px-4 bg-gray-50 hover:bg-indigo-50 text-gray-700 hover:text-indigo-700 border border-gray-200 hover:border-indigo-200 rounded-xl font-semibold transition-colors flex items-center justify-between group">
                    <span>Foco Intenso (25 min)</span>
                    <svg class="w-5 h-5 text-gray-400 group-hover:text-indigo-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                </button>
                <button onclick="startCountdown(15)" class="w-full py-3 px-4 bg-gray-50 hover:bg-indigo-50 text-gray-700 hover:text-indigo-700 border border-gray-200 hover:border-indigo-200 rounded-xl font-semibold transition-colors flex items-center justify-between group">
                    <span>Pausa / Rápido (15 min)</span>
                    <svg class="w-5 h-5 text-gray-400 group-hover:text-indigo-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                </button>
                <button id="btnWarnEnd" onclick="startEndWarning()" class="hidden w-full py-3 px-4 bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 rounded-xl font-semibold transition-colors flex items-center justify-between">
                    <span id="warnEndText">Avisar no fim (--:--)</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </button>
                <button onclick="closeModal('timerModal')" class="w-full mt-2 py-3 px-4 text-gray-500 hover:text-gray-700 font-medium text-center">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Global Focus Timer Modal (Slider) -->
    <div id="globalFocusModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeModal('globalFocusModal')">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden p-6 text-center" onclick="event.stopPropagation()">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-indigo-100">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h3 class="text-2xl font-bold text-gray-800">Timer de Foco</h3>
            <p class="text-gray-500 text-sm mt-1 mb-6">Defina o tempo de concentração</p>

            <div class="mb-8 px-4">
                <span id="focusSliderValue" class="text-5xl font-black text-indigo-600 block mb-4 transition-all">25<span class="text-xl text-indigo-400 font-bold ml-1">min</span></span>
                <input type="range" id="focusTimeSlider" min="1" max="120" value="25" class="w-full" oninput="updateSliderLabel(this.value)">
                <div class="flex justify-between text-xs text-gray-400 mt-2 font-medium">
                    <span>1 min</span>
                    <span>120 min</span>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal('globalFocusModal')" class="flex-1 py-3.5 bg-gray-100 text-gray-600 font-bold rounded-xl hover:bg-gray-200 transition-colors">
                    Cancelar
                </button>
                <button onclick="startGlobalFocusTimer()" class="flex-[2] py-3.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-200 transition-all active:scale-95">
                    Iniciar Foco
                </button>
            </div>
        </div>
    </div>

    <script>
        const GRID_SIZE = 60;
        const SWIPE_WIDTH = -180;
        
        const COLORS = [
            { id: 'blue', classes: 'bg-blue-50 border-blue-200 text-blue-900', ring: 'focus:ring-blue-400' },
            { id: 'green', classes: 'bg-green-50 border-green-200 text-green-900', ring: 'focus:ring-green-400' },
            { id: 'yellow', classes: 'bg-yellow-50 border-yellow-200 text-yellow-900', ring: 'focus:ring-yellow-400' },
            { id: 'pink', classes: 'bg-pink-50 border-pink-200 text-pink-900', ring: 'focus:ring-pink-400' },
            { id: 'purple', classes: 'bg-purple-50 border-purple-200 text-purple-900', ring: 'focus:ring-purple-400' }
        ];

        // Load State from LocalStorage or default
        let state = {
            startTime: '13:00',
            endTime: '18:00',
            tasks: [],
            editingId: null
        };

        const savedData = localStorage.getItem('organizador_tarefas_state');
        if (savedData) {
            try {
                state = JSON.parse(savedData);
            } catch (e) {
                console.error("Erro ao carregar dados salvos:", e);
            }
        }

        function saveState() {
            localStorage.setItem('organizador_tarefas_state', JSON.stringify(state));
        }

        let timer = {
            active: false,
            interval: null,
            endTime: null, 
            type: null, 
            targetTimeStr: null, 
            taskId: null,
            title: null
        };

        const tasksContainer = document.getElementById('tasksContainer');
        const scrollContainer = document.getElementById('scrollContainer');
        const gridArea = document.getElementById('gridArea');

        window.addEventListener('DOMContentLoaded', () => {
            // Apply loaded times to display
            document.getElementById('startTimeDisplay').textContent = state.startTime;
            document.getElementById('endTimeDisplay').textContent = state.endTime;

            initColorPicker();
            renderTasks();
            updateTimelineDot();
            updateClock();
            
            setInterval(updateTimelineDot, 60000); 
            setInterval(updateClock, 10000); 
        });

        function parseTime(timeStr) {
            if (!timeStr) return 0;
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('realWorldClock').textContent = 
                `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        function renderTasks() {
            tasksContainer.innerHTML = '';
            
            state.tasks.forEach(task => {
                const colorObj = COLORS[task.colorIdx] || COLORS[0];
                
                const wrapper = document.createElement('div');
                wrapper.className = 'absolute left-4 right-8 pointer-events-auto z-10';
                wrapper.style.top = `${task.top}px`;
                wrapper.style.height = `${GRID_SIZE - 4}px`; 
                wrapper.dataset.id = task.id;

                const actionsBg = document.createElement('div');
                actionsBg.className = 'absolute inset-y-0 right-0 flex rounded-xl overflow-hidden shadow-inner bg-gray-100 border border-gray-200';
                actionsBg.style.width = Math.abs(SWIPE_WIDTH) + 'px';
                actionsBg.innerHTML = `
                    <button class="flex-1 flex flex-col items-center justify-center bg-gray-50 hover:bg-gray-200 text-gray-700 transition-colors border-r border-gray-200" onpointerdown="event.stopPropagation()" onclick="openEditTask('${task.id}')">
                        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        <span class="text-[10px] font-bold">Editar</span>
                    </button>
                    <button class="flex-1 flex flex-col items-center justify-center bg-indigo-50 hover:bg-indigo-100 text-indigo-600 transition-colors border-r border-gray-200" onpointerdown="event.stopPropagation()" onclick="openTaskTimerModal('${task.id}')">
                        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="text-[10px] font-bold">Tempo</span>
                    </button>
                    <button class="flex-1 flex flex-col items-center justify-center bg-red-50 hover:bg-red-100 text-red-600 transition-colors" onpointerdown="event.stopPropagation()" onclick="deleteTask('${task.id}')">
                        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        <span class="text-[10px] font-bold">Excluir</span>
                    </button>
                `;

                const card = document.createElement('div');
                card.className = `task-card absolute inset-0 flex items-center px-4 rounded-xl border shadow-sm cursor-grab active:cursor-grabbing snap-transition ${colorObj.classes}`;
                if (task.swiped) card.style.transform = `translateX(${SWIPE_WIDTH}px)`;
                
                let timeText = '';
                if (task.start) timeText = task.start + (task.end ? ` - ${task.end}` : '');

                card.innerHTML = `
                    <div class="flex-1 min-w-0 pr-2">
                        <p class="font-bold text-[15px] truncate text-gray-800">${escapeHtml(task.title)}</p>
                        ${task.desc ? `<p class="text-xs text-gray-500 font-medium mt-0.5 truncate">${escapeHtml(task.desc)}</p>` : ''}
                    </div>
                    ${timeText ? `<div class="text-[11px] font-bold px-2 py-1 bg-white/60 rounded-md shrink-0 border border-black/5 text-gray-600">${timeText}</div>` : ''}
                    <div class="ml-3 shrink-0 opacity-30">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M7 2a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7 5a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7 14a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
                        </svg>
                    </div>
                `;

                attachPointerEvents(card, wrapper, task);

                wrapper.appendChild(actionsBg);
                wrapper.appendChild(card);
                tasksContainer.appendChild(wrapper);
            });
        }

        function attachPointerEvents(cardEl, wrapperEl, taskObj) {
            let dragState = null;

            cardEl.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return;
                e.stopPropagation();

                cardEl.classList.remove('snap-transition');

                dragState = {
                    startX: e.clientX,
                    startY: e.clientY,
                    startTop: parseInt(wrapperEl.style.top || 0),
                    startTx: taskObj.swiped ? SWIPE_WIDTH : 0,
                    mode: null, 
                    hasMoved: false
                };

                cardEl.setPointerCapture(e.pointerId);
                
                state.tasks.forEach(t => {
                    if (t.id !== taskObj.id && t.swiped) {
                        t.swiped = false;
                        renderTasks(); 
                    }
                });
            });

            cardEl.addEventListener('pointermove', (e) => {
                if (!dragState) return;

                const dx = e.clientX - dragState.startX;
                const dy = e.clientY - dragState.startY;

                if (!dragState.mode) {
                    if (Math.abs(dx) > 10) {
                        dragState.mode = 'swipe';
                    } else if (Math.abs(dy) > 10) {
                        dragState.mode = 'drag';
                        wrapperEl.style.zIndex = '50'; 
                        cardEl.classList.add('shadow-xl', 'scale-[1.02]', 'border-indigo-300');
                    }
                }

                if (dragState.mode === 'drag') {
                    e.preventDefault(); 
                    dragState.hasMoved = true;
                    let newTop = dragState.startTop + dy;
                    newTop = Math.max(0, newTop); 
                    wrapperEl.style.top = `${newTop}px`;

                } else if (dragState.mode === 'swipe') {
                    e.preventDefault(); 
                    dragState.hasMoved = true;
                    let newTx = dragState.startTx + dx;
                    newTx = Math.max(SWIPE_WIDTH, Math.min(0, newTx)); 
                    cardEl.style.transform = `translateX(${newTx}px)`;
                }
            });

            const handleUpOrCancel = (e) => {
                if (!dragState) return;
                
                cardEl.releasePointerCapture(e.pointerId);
                cardEl.classList.add('snap-transition');
                cardEl.classList.remove('shadow-xl', 'scale-[1.02]', 'border-indigo-300');
                wrapperEl.style.zIndex = '10';

                if (dragState.mode === 'drag') {
                    const currentTop = parseInt(wrapperEl.style.top || 0);
                    let snappedTop = Math.round(currentTop / GRID_SIZE) * GRID_SIZE;
                    taskObj.top = snappedTop;
                    wrapperEl.style.top = `${snappedTop}px`;
                    saveState(); // Salva posição nova
                    
                } else if (dragState.mode === 'swipe') {
                    const currentTx = dragState.startTx + (e.clientX - dragState.startX);
                    if (currentTx < (SWIPE_WIDTH / 2)) {
                        taskObj.swiped = true;
                        cardEl.style.transform = `translateX(${SWIPE_WIDTH}px)`;
                    } else {
                        taskObj.swiped = false;
                        cardEl.style.transform = 'translateX(0px)';
                    }
                } else {
                    if (taskObj.swiped) {
                        taskObj.swiped = false;
                        cardEl.style.transform = 'translateX(0px)';
                    }
                }

                dragState = null;
            };

            cardEl.addEventListener('pointerup', handleUpOrCancel);
            cardEl.addEventListener('pointercancel', handleUpOrCancel);
        }

        function handleGridClick(e) {
            if (e.target.closest('.pointer-events-auto')) return;
            
            const rect = gridArea.getBoundingClientRect();
            const clickY = e.clientY - rect.top;
            const snappedY = Math.floor(clickY / GRID_SIZE) * GRID_SIZE;

            openTaskModal(null, snappedY);
        }

        function openTaskModal(taskId = null, yPos = 0) {
            state.editingId = taskId;
            document.getElementById('taskForm').reset();
            document.getElementById('taskModalTitle').textContent = taskId ? "Editar Tarefa" : "Nova Tarefa";

            if (taskId) {
                const task = state.tasks.find(t => t.id === taskId);
                if (task) {
                    document.getElementById('taskTitle').value = task.title;
                    document.getElementById('taskDesc').value = task.desc || '';
                    document.getElementById('taskStartTime').value = task.start || '';
                    document.getElementById('taskEndTime').value = task.end || '';
                    document.getElementById('taskYPos').value = task.top;
                    document.querySelector(`input[name="taskColor"][value="${task.colorIdx}"]`).checked = true;
                    task.swiped = false;
                    renderTasks();
                }
            } else {
                document.getElementById('taskYPos').value = yPos;
                document.querySelector('input[name="taskColor"][value="0"]').checked = true;
            }

            document.getElementById('taskModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('taskTitle').focus(), 100);
        }

        function openEditTask(taskId) {
            openTaskModal(taskId);
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            state.tasks.forEach(t => t.swiped = false);
            renderTasks(); 
        }

        function initColorPicker() {
            const container = document.getElementById('colorPicker');
            container.innerHTML = '';
            COLORS.forEach((c, i) => {
                const [bg, border] = c.classes.split(' ');
                const html = `
                    <label class="relative cursor-pointer">
                        <input type="radio" name="taskColor" value="${i}" class="peer sr-only">
                        <div class="w-10 h-10 rounded-full border-2 ${bg} ${border} ring-offset-2 peer-checked:ring-2 peer-checked:${c.ring} flex items-center justify-center transition-all hover:scale-110">
                            <svg class="w-5 h-5 opacity-0 peer-checked:opacity-100 text-black/50 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </label>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function saveTask(e) {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value.trim();
            if (!title) return;

            const colorNode = document.querySelector('input[name="taskColor"]:checked');
            
            const taskData = {
                title: title,
                desc: document.getElementById('taskDesc').value.trim(),
                start: document.getElementById('taskStartTime').value,
                end: document.getElementById('taskEndTime').value,
                top: parseInt(document.getElementById('taskYPos').value),
                colorIdx: colorNode ? parseInt(colorNode.value) : 0,
                swiped: false
            };

            if (state.editingId) {
                const index = state.tasks.findIndex(t => t.id === state.editingId);
                if (index !== -1) {
                    state.tasks[index] = { ...state.tasks[index], ...taskData };
                }
            } else {
                taskData.id = 't_' + Date.now();
                state.tasks.push(taskData);
            }

            saveState(); // Salva no PC
            closeModal('taskModal');
            renderTasks();
        }

        function deleteTask(id) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            saveState(); // Salva alteração
            renderTasks();
        }

        function editMarker(type) {
            const current = type === 'start' ? state.startTime : state.endTime;
            const label = type === 'start' ? 'Início da Tarde' : 'Final da Tarde';
            
            const newTime = prompt(`Defina o horário de ${label} (HH:MM):`, current);
            
            if (newTime && /^\d{2}:\d{2}$/.test(newTime)) {
                state[type + 'Time'] = newTime;
                document.getElementById(`${type}TimeDisplay`).textContent = newTime;
                saveState(); // Salva novo horário dos marcadores
                updateTimelineDot();
            } else if (newTime !== null) {
                alert("Formato inválido. Use HH:MM");
            }
        }

        function updateTimelineDot() {
            const dot = document.getElementById('timelineDot');
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();

            const startMins = parseTime(state.startTime);
            const endMins = parseTime(state.endTime);
            
            const startY = 60;
            const endY = 660;
            const distanceY = endY - startY;

            if (startMins >= endMins) return; 

            let topY;
            if (currentMins <= startMins) {
                topY = startY;
            } else if (currentMins >= endMins) {
                topY = endY;
            } else {
                const progress = (currentMins - startMins) / (endMins - startMins);
                topY = startY + (progress * distanceY);
            }

            dot.style.top = `${topY}px`;
        }

        function openTaskTimerModal(taskId) {
            const task = state.tasks.find(t => t.id === taskId);
            if (!task) return;
            
            timer.taskId = taskId;
            timer.title = task.title;
            document.getElementById('timerModalTarget').textContent = `Tarefa: ${task.title}`;
            
            const warnBtn = document.getElementById('btnWarnEnd');
            if (task.end) {
                warnBtn.classList.remove('hidden');
                document.getElementById('warnEndText').textContent = `Avisar no fim (${task.end})`;
                timer.targetTimeStr = task.end;
            } else {
                warnBtn.classList.add('hidden');
            }

            task.swiped = false;
            renderTasks();
            
            document.getElementById('timerModal').classList.remove('hidden');
        }

        function startCountdown(minutes) {
            stopTimer(); 
            timer.active = true;
            timer.type = 'countdown';
            timer.endTime = Date.now() + (minutes * 60000);
            
            document.getElementById('timerTaskName').textContent = timer.title;
            closeModal('timerModal');
            document.getElementById('activeTimerBanner').classList.remove('hidden');
            
            updateTimerDisplay();
            timer.interval = setInterval(updateTimerDisplay, 1000);
        }

        function startEndWarning() {
            if (!timer.targetTimeStr) return;
            stopTimer();

            timer.active = true;
            timer.type = 'warning';
            
            document.getElementById('timerTaskName').textContent = timer.title;
            document.getElementById('timerCountdown').textContent = `Alarme: ${timer.targetTimeStr}`;
            
            closeModal('timerModal');
            document.getElementById('activeTimerBanner').classList.remove('hidden');

            timer.interval = setInterval(() => {
                const now = new Date();
                const [h, m] = timer.targetTimeStr.split(':').map(Number);
                if (now.getHours() > h || (now.getHours() === h && now.getMinutes() >= m)) {
                    alert(`Atenção: Horário da tarefa "${timer.title}" atingido!`);
                    stopTimer();
                }
            }, 5000); 
        }

        function openGlobalFocusModal() {
            document.getElementById('globalFocusModal').classList.remove('hidden');
        }

        function updateSliderLabel(val) {
            document.getElementById('focusSliderValue').innerHTML = `${val}<span class="text-xl text-indigo-400 font-bold ml-1">min</span>`;
        }

        function startGlobalFocusTimer() {
            const mins = parseInt(document.getElementById('focusTimeSlider').value);
            timer.title = "Foco Livre";
            startCountdown(mins);
            closeModal('globalFocusModal');
        }

        function updateTimerDisplay() {
            if (!timer.active || timer.type !== 'countdown') return;

            const remaining = Math.max(0, timer.endTime - Date.now());
            const totalSeconds = Math.floor(remaining / 1000);
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');

            document.getElementById('timerCountdown').textContent = `${m}:${s}`;

            if (totalSeconds <= 0) {
                alert(`Tempo esgotado para: ${timer.title}`);
                stopTimer();
            }
        }

        function stopTimer() {
            if (timer.interval) clearInterval(timer.interval);
            timer.active = false;
            document.getElementById('activeTimerBanner').classList.add('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
